name: Offline deployment checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,video,realworld-test]' 'ruff==0.17.0'
      - name: Lint and shell syntax
        run: |
          ruff check .
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: CPU inference, protocol, MPC, and recorder tests
        run: PYTHON=python bash deployment/test.sh
  robot-python:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: deployment/robot/requirements.txt
      - name: Install robot Python dependencies without ROS or Torch
        run: python -m pip install -r deployment/robot/requirements.txt
      - name: Robot client, MPC, recording, and deployment checks
        run: PYTHON=python bash deployment/test.sh --robot
